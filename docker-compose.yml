version: '3.8'

services:
  mysql:
    image: mysql:8.0.36
    container_name: smart-consume-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Smart@2026
      MYSQL_DATABASE: smart_consume
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - smart-net
    restart: always

  redis:
    image: redis:7.2-alpine
    container_name: smart-consume-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - smart-net
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-consume-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smart_consume?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Smart@2026
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
    networks:
      - smart-net
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart-consume-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - smart-net
    restart: always

volumes:
  mysql-data:
  redis-data:

networks:
  smart-net:
    driver: bridge
